name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ugcnp/shared build
      - run: pnpm --filter ugcnp-backend prisma:generate
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm --filter ugcnp-backend test
      - run: pnpm --filter @ugcnp/shared test

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ugcnp/shared build
      - run: pnpm --filter ugcnp-backend prisma:generate
      - run: pnpm --filter ugcnp-backend build
      - run: pnpm --filter ugcnp-frontend build

  deploy-railway:
    name: Deploy Railway (backend, ai, minio)
    runs-on: ubuntu-latest
    needs: [check, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger git-source deploys
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          env_id="9a0a94c9-1de6-4311-8392-d09618af218a"
          for svc in \
            3130b745-fae1-4143-b16a-ae443711850b \
            c99c62a8-ad02-44d5-a177-c79ca538ef86 \
            fd2816a6-7c35-43f0-a591-114f4d8d1bac; do
            query="mutation{serviceInstanceDeployV2(serviceId:\"$svc\",environmentId:\"$env_id\",commitSha:\"$SHA\"){id}}"
            body=$(printf '{"query":"%s"}' "$query")
            resp=$(curl -sS -X POST https://backboard.railway.app/graphql/v2 \
              -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H "Content-Type: application/json" \
              --data-raw "$body")
            echo "$svc -> $resp"
            printf '%s' "$resp" | grep -q '"errors"' && { echo "deploy failed"; exit 1; }
          done