name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ugcnp/shared build
      - run: pnpm --filter ugcnp-backend prisma:generate
        env:
          DATABASE_URL: "postgresql://ugcnp:ugcnp@localhost:5432/ugcnp?schema=public"
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm --filter ugcnp-backend test
      - run: pnpm --filter @ugcnp/shared test

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ugcnp/shared build
      - run: pnpm --filter ugcnp-backend prisma:generate
        env:
          DATABASE_URL: "postgresql://ugcnp:ugcnp@localhost:5432/ugcnp?schema=public"
      - run: pnpm --filter ugcnp-backend build
      - run: pnpm --filter ugcnp-frontend build

  ai:
    name: AI service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q

  migrations:
    name: Apply database migrations
    runs-on: ubuntu-latest
    needs: [check, build]
    # Migrations are never run during a build, because two concurrent builds
    # would race on the same DDL. Run them explicitly against the target
    # database, either manually or by pushing this branch to main.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ugcnp/shared build
      - run: pnpm --filter ugcnp-backend prisma:generate
        env:
          # Unpooled connection string: pooled endpoints cannot run DDL.
          DATABASE_URL: ${{ vars.DATABASE_URL_DIRECT }}
      - run: pnpm --filter ugcnp-backend prisma:migrate:deploy
        env:
          DATABASE_URL: ${{ vars.DATABASE_URL_DIRECT }}
